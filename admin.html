<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پنل مدیریت محصولات</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Tahoma, Arial, sans-serif; }
        body { background-color: #f1f5f9; padding: 2rem; color: #1e293b; }
        .container { max-width: 950px; margin: 0 auto; background: white; padding: 2rem; border-radius: 1rem; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); }
        .top-links { display: flex; justify-content: space-between; margin-bottom: 1.5rem; }
        a.btn-link { color: #6366f1; text-decoration: none; font-weight: bold; }
        a.logout-btn { color: #ef4444; text-decoration: none; font-weight: bold; }
        h3 { margin-bottom: 1rem; color: #4338ca; }
        form.add-form { background: #f8fafc; padding: 1.5rem; border-radius: 0.5rem; border: 1px solid #e2e8f0; display: grid; gap: 1rem; margin-bottom: 2.5rem; }
        input, textarea { width: 100%; padding: 0.75rem; border: 1px solid #cbd5e1; border-radius: 0.5rem; }
        button.submit-btn { background: #10b981; color: white; border: none; padding: 0.75rem; border-radius: 0.5rem; font-weight: bold; cursor: pointer; }
        button.submit-btn:hover { background: #059669; }
        table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
        th, td { padding: 0.75rem; text-align: right; border-bottom: 1px solid #e2e8f0; font-size: 0.9rem; }
        th { background: #f8fafc; font-weight: bold; }
        .btn-danger { background: #ef4444; color: white; border: none; padding: 0.4rem 0.8rem; font-size: 0.8rem; border-radius: 0.3rem; cursor: pointer; }
        .btn-danger:hover { background: #dc2626; }
    </style>
</head>
<body>

    <div class="container">
        <div class="top-links">
            <a href="/" class="btn-link">← مشاهده سایت</a>
            <a href="/admin/logout" class="logout-btn">خروج از حساب</a>
        </div>
        
        <h3>افزودن محصول جدید</h3>
        <form method="POST" class="add-form">
            <input type="text" name="title" placeholder="عنوان محصول" required>
            <input type="text" name="slug" placeholder="شناسه یکتا (مثلا: smart-watch)" required>
            <input type="text" name="category" placeholder="دسته‌بندی (مثلا: دیجیتال)" required>
            <input type="url" name="target_url" placeholder="لینک کامل مقصد (https://...)" required>
            <input type="url" name="image_url" placeholder="لینک تصویر محصول (اختیاری - https://...)">
            <textarea name="description" placeholder="توضیحات کوتاه" rows="2"></textarea>
            <button type="submit" class="submit-btn">ثبت محصول</button>
        </form>

        <h3>لیست محصولات موجود</h3>
        <table>
            <thead>
                <tr>
                    <th>عنوان</th>
                    <th>دسته‌بندی</th>
                    <th>اسلاگ</th>
                    <th>کلیک‌ها</th>
                    <th>عملیات</th>
                </tr>
            </thead>
            <tbody>
                {% for product in products %}
                    <tr>
                        <td><b>{{ product.title }}</b></td>
                        <td>{{ product.category }}</td>
                        <td><code>{{ product.slug }}</code></td>
                        <td><b>{{ product.clicks }}</b></td>
                        <td>
                            <form action="/admin/delete/{{ product.id }}" method="POST" onsubmit="return confirm('آیا از حذف مطمئن هستید؟');">
                                <button type="submit" class="btn-danger">حذف</button>
                            </form>
                        </td>
                    </tr>
                {% else %}
                    <tr>
                        <td colspan="5" style="text-align: center; color: #64748b; padding: 2rem;">هیچ محصولی ثبت نشده است.</td>
                    </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>

</body>
</html>

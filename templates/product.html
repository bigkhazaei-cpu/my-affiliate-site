<!-- بخش نظرات -->
        <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6 sm:p-8 mb-8">
            <h3 class="text-xl font-bold text-gray-900 mb-6 flex items-center gap-2">
                <svg class="w-6 h-6 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"></path></svg>
                نظرات کاربران
            </h3>
            
            <div class="space-y-4 mb-8">
                {% if comments %}
                    {% for c in comments %}
                        <div class="bg-gray-50/50 rounded-xl p-4 border border-gray-100">
                            <div class="flex justify-between items-center mb-2">
                                <span class="font-bold text-sm text-gray-800">{{ c.author }}</span>
                                <span class="text-xs text-amber-500 font-bold bg-amber-50 px-2 py-1 rounded-lg">⭐ {{ c.rating }} از 5</span>
                            </div>
                            <p class="text-gray-600 text-sm leading-relaxed">{{ c.content }}</p>
                        </div>
                    {% endfor %}
                {% else %}
                    <div class="text-center py-8 bg-gray-50/50 rounded-xl border border-gray-100 text-gray-400 text-sm">
                        هنوز نظری برای این محصول ثبت نشده است. اولین نفر باشید!
                    </div>
                {% endif %}
            </div>

            <!-- فرم ثبت نظر -->
            <form action="{{ url_for('add_comment', product_id=product.id) }}" method="POST" class="bg-gray-50/50 p-6 rounded-2xl border border-gray-100 space-y-4">
                <h4 class="font-bold text-gray-800 text-sm flex items-center gap-1.5">
                    <svg class="w-4 h-4 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg>
                    ثبت نظر جدید
                </h4>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 mb-1">نام شما</label>
                        <input type="text" name="author" placeholder="نام خود را وارد کنید" required class="w-full px-4 py-2.5 rounded-xl border border-gray-200 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-600 transition bg-white">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 mb-1">امتیاز شما</label>
                        <select name="rating" class="w-full px-4 py-2.5 rounded-xl border border-gray-200 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-600 transition bg-white">
                            <option value="5">۵ ستاره (عالی)</option>
                            <option value="4">۴ ستاره (خوب)</option>
                            <option value="3">۳ ستاره (متوسط)</option>
                            <option value="2">۲ ستاره (ضعیف)</option>
                            <option value="1">۱ ستاره (بسیار بد)</option>
                        </select>
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">متن نظر</label>
                    <textarea name="content" rows="3" placeholder="نظر خود درباره این محصول را بنویسید..." required class="w-full px-4 py-2.5 rounded-xl border border-gray-200 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-600 transition bg-white"></textarea>
                </div>
                <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-2.5 rounded-xl text-sm font-medium transition shadow-sm">ارسال نظر</button>
            </form>
        </div>

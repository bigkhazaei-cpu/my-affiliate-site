<!-- در بخش پایانی محتوای product_detail.html، بخش نظرات را اضافه کنید -->
<div class="mt-12 bg-white rounded-3xl border border-slate-200 p-6 md:p-8 shadow-sm">
    <h2 class="text-xl font-bold text-slate-900 mb-6">نظرات و امتیازات کاربران</h2>
    
    <!-- فرم ثبت نظر -->
    <form method="POST" class="mb-10 bg-slate-50 p-6 rounded-2xl border border-slate-200 space-y-4">
        <h3 class="text-sm font-bold text-slate-700">نظر خود را درباره این محصول ثبت کنید</h3>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <input type="text" name="author" required placeholder="نام شما" class="bg-white border border-slate-200 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-violet-500">
            <select name="rating" class="bg-white border border-slate-200 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-violet-500">
                <option value="5">⭐⭐⭐⭐⭐ (۵ از ۵ - عالی)</option>
                <option value="4">⭐⭐⭐⭐ (۴ از ۵ - خوب)</option>
                <option value="3">⭐⭐⭐ (۳ از ۵ - متوسط)</option>
                <option value="2">⭐⭐ (۲ از ۵ - ضعیف)</option>
                <option value="1">⭐ (۱ از ۵ - خیلی بد)</option>
            </select>
        </div>
        <textarea name="comment" required rows="3" placeholder="متن نظر..." class="w-full bg-white border border-slate-200 rounded-xl p-4 text-sm focus:outline-none focus:border-violet-500"></textarea>
        <button type="submit" class="bg-violet-600 hover:bg-violet-700 text-white px-6 py-2.5 rounded-xl text-sm font-medium transition shadow-md shadow-violet-200">
            ارسال نظر
        </button>
    </form>

    <!-- لیست نظرات -->
    <div class="space-y-4">
        {% if reviews %}
        {% for r in reviews %}
        <div class="bg-slate-50/50 p-4 rounded-2xl border border-slate-100">
            <div class="flex justify-between items-center mb-2">
                <span class="font-bold text-slate-800 text-sm">{{ r.author }}</span>
                <span class="text-amber-500 text-xs">
                    {% for i in range(r.rating) %}⭐{% endfor %}
                </span>
            </div>
            <p class="text-slate-600 text-sm leading-relaxed">{{ r.comment }}</p>
        </div>
        {% endfor %}
        {% else %}
        <p class="text-slate-400 text-sm text-center py-4">هنوز نظری برای این محصول ثبت نشده است. اولین نفر باشید!</p>
        {% endif %}
    </div>
</div>

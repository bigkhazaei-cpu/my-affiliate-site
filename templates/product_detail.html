<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ product.title }} - جزئیات محصول</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <style>body { font-family: 'Vazirmatn', sans-serif; }</style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col justify-between">

    <!-- هدر ساده -->
    <header class="bg-white border-b border-slate-200 py-4 shadow-sm">
        <div class="max-w-5xl mx-auto px-4 flex justify-between items-center">
            <a href="/" class="text-violet-600 hover:text-violet-700 text-sm font-medium flex items-center gap-2">
                ← بازگشت به صفحه اصلی
            </a>
            <span class="text-xs bg-violet-100 text-violet-700 px-3 py-1 rounded-full font-medium">{{ product.category }}</span>
        </div>
    </header>

    <!-- محتوای جزئیات محصول -->
    <main class="max-w-5xl mx-auto px-4 py-12 flex-grow w-full">
        <div class="bg-white rounded-3xl border border-slate-200 shadow-sm overflow-hidden grid grid-cols-1 md:grid-cols-2 gap-8 p-6 md:p-8 items-center">
            
            <!-- تصویر محصول -->
            <div class="h-80 bg-slate-100 rounded-2xl overflow-hidden shadow-inner flex items-center justify-center">
                {% if product.image_url %}
                <img src="{{ product.image_url }}" alt="{{ product.title }}" class="w-full h-full object-cover">
                {% else %}
                <span class="text-slate-400 text-sm">بدون تصویر</span>
                {% endif %}
            </div>

            <!-- اطلاعات و دکمه خرید -->
            <div class="flex flex-col justify-between h-full space-y-6">
                <div>
                    <h1 class="text-2xl md:text-3xl font-extrabold text-slate-900 leading-tight">
                        {{ product.title }}
                    </h1>
                    <div class="mt-4 text-slate-600 text-base leading-relaxed whitespace-pre-line">
                        {{ product.description }}
                    </div>
                </div>

                <div class="space-y-4 pt-6 border-t border-slate-100">
                    <div class="flex items-center justify-between text-sm text-slate-500">
                        <span>تعداد کلیک روی لینک:</span>
                        <strong class="text-slate-800 font-bold">{{ product.clicks }}</strong>
                    </div>

                    <a href="{{ product.affiliate_link }}" target="_blank" class="block w-full text-center bg-emerald-500 hover:bg-emerald-600 text-white font-bold py-4 rounded-2xl shadow-lg shadow-emerald-200 transition text-base">
                        مشاهده در فروشگاه و خرید 🚀
                    </a>
                </div>
            </div>

        </div>
    </main>

    <!-- فوتر -->
    <footer class="bg-white border-t border-slate-200 py-6 text-center text-slate-500 text-sm">
        تمامی حقوق محفوظ است | سیستم هوشمند همکاری در فروش
    </footer>

</body>
</html>

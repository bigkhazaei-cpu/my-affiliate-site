<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ورود به پنل ادمین</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="login-container">
        <h2 style="margin-bottom: 20px; text-align: center; color: #2c3e50;">ورود ادمین</h2>
        <form method="POST">
            <div class="form-group">
                <label>رمز عبور</label>
                <input type="password" name="password" required placeholder="رمز عبور را وارد کنید">
            </div>
            <button type="submit" class="btn" style="width: 100%;">ورود</button>
        </form>
        <p style="text-align: center; margin-top: 15px;"><a href="{{ url_for('home') }}" style="color: #3498db; text-decoration: none;">بازگشت به صفحه اصلی</a></p>
    </div>
</body>
</html>

<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>ورود مدیر | دیجی‌پلاس</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 flex items-center justify-center h-screen">
    <div class="bg-white p-8 rounded-2xl shadow-sm border w-96 text-center">
        <h2 class="text-base font-bold text-red-600 mb-4">ورود به پنل مدیریت</h2>
        <form method="POST" class="space-y-4">
            <input type="password" name="password" placeholder="رمز عبور ادمین..." required class="w-full border rounded-lg px-3 py-2 text-xs focus:outline-none">
            <button type="submit" class="w-full bg-red-600 text-white py-2 rounded-lg text-xs font-bold hover:bg-red-700">ورود</button>
        </form>
        <a href="/" class="block mt-4 text-xs text-gray-400">← بازگشت به صفحه اصلی</a>
    </div>
</body>
</html>

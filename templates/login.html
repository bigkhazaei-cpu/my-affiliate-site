<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ورود به پنل مدیریت</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <style>body { font-family: 'Vazirmatn', sans-serif; }</style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white p-8 rounded-3xl border border-slate-200 shadow-xl w-full max-w-md">
        <div class="text-center mb-8">
            <h1 class="text-2xl font-extrabold text-slate-900">ورود به مدیریت</h1>
            <p class="text-slate-400 text-sm mt-2">لطفاً رمز عبور ادمین را وارد کنید</p>
        </div>

        {% if error %}
        <div class="bg-rose-50 border border-rose-200 text-rose-600 text-sm p-3 rounded-xl mb-6 text-center">
            {{ error }}
        </div>
        {% endif %}

        <form method="POST" action="/login" class="space-y-5">
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-2">رمز عبور</label>
                <input type="password" name="password" required autofocus class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-violet-500 transition">
            </div>
            <button type="submit" class="w-full bg-violet-600 hover:bg-violet-700 text-white font-medium py-3 rounded-xl transition shadow-md shadow-violet-200">
                ورود به پنل
            </button>
        </form>

        <div class="mt-6 text-center">
            <a href="/" class="text-slate-400 hover:text-slate-600 text-xs transition">← بازگشت به صفحه اصلی سایت</a>
        </div>
    </div>

</body>
</html>

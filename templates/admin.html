<!-- در بخش فرم admin.html -->
<form method="POST" action="/admin/add" enctype="multipart/form-data" class="grid grid-cols-1 md:grid-cols-2 gap-6">
    <div>
        <label class="block text-sm font-medium text-slate-700 mb-2">عنوان محصول</label>
        <input type="text" name="title" required class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-violet-500">
    </div>
    <div>
        <label class="block text-sm font-medium text-slate-700 mb-2">دسته‌بندی</label>
        <input type="text" name="category" required placeholder="مثلا: دیجیتال، پوشاک..." class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-violet-500">
    </div>
    <div>
        <label class="block text-sm font-medium text-slate-700 mb-2">قیمت اصلی (تومان)</label>
        <input type="number" name="price" placeholder="مثلا: 1000000" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-violet-500">
    </div>
    <div>
        <label class="block text-sm font-medium text-slate-700 mb-2">قیمت با تخفیف (تومان)</label>
        <input type="number" name="discount_price" placeholder="مثلا: 850000" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-violet-500">
    </div>
    <div class="md:col-span-2">
        <label class="block text-sm font-medium text-slate-700 mb-2">توضیحات</label>
        <textarea name="description" rows="3" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-violet-500"></textarea>
    </div>
    <div>
        <label class="block text-sm font-medium text-slate-700 mb-2">لینک افیلیت (مقصد خرید)</label>
        <input type="url" name="affiliate_link" required class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-violet-500">
    </div>
    <div>
        <label class="block text-sm font-medium text-slate-700 mb-2">آپلود تصویر محصول (فایل)</label>
        <input type="file" name="image_file" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-sm file:font-semibold file:bg-violet-50 file:text-violet-700 hover:file:bg-violet-100">
    </div>
    <div class="md:col-span-2">
        <button type="submit" class="bg-violet-600 hover:bg-violet-700 text-white font-medium px-6 py-3 rounded-xl transition shadow-md shadow-violet-200 w-full md:w-auto">
            ثبت و انتشار محصول با امکانات کامل
        </button>
    </div>
</form>

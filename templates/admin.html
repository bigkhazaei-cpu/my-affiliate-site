<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>پنل مدیریت | دیجی‌پلاس</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 font-sans p-6">
    <div class="max-w-6xl mx-auto space-y-6">
        <div class="bg-white p-4 rounded-2xl shadow-sm flex justify-between items-center">
            <h1 class="font-bold text-sm text-red-600">پنل مدیریت و افزودن محصولات</h1>
            <div class="flex gap-2">
                <a href="/" class="bg-gray-100 px-3 py-1.5 rounded text-xs font-bold text-gray-700">مشاهده سایت</a>
                <a href="/logout" class="bg-red-50 text-red-600 px-3 py-1.5 rounded text-xs font-bold">خروج</a>
            </div>
        </div>

        <!-- فرم افزودن محصول -->
        <div class="bg-white p-6 rounded-2xl shadow-sm">
            <h3 class="font-bold text-xs text-gray-800 mb-4">افزودن محصول جدید</h3>
            <form method="POST" class="grid grid-cols-1 sm:grid-cols-2 gap-4 text-xs">
                <input type="text" name="title" placeholder="عنوان محصول" required class="border rounded p-2">
                <input type="text" name="category" placeholder="دسته‌بندی (مثلاً دیجیتال، پوشاک)" required class="border rounded p-2">
                <input type="number" name="price" placeholder="قیمت اصلی (تومان)" required class="border rounded p-2">
                <input type="number" name="discount_price" placeholder="قیمت با تخفیف (تومان)" required class="border rounded p-2">
                <input type="url" name="affiliate_link" placeholder="لینک افیلیت (https://...)" required class="border rounded p-2 sm:col-span-2">
                <input type="url" name="image_url" placeholder="لینک تصویر محصول (https://...)" required class="border rounded p-2 sm:col-span-2">
                <textarea name="description" placeholder="توضیحات و بررسی محصول..." rows="3" required class="border rounded p-2 sm:col-span-2"></textarea>
                <button type="submit" class="bg-green-600 text-white py-2.5 rounded font-bold sm:col-span-2 hover:bg-green-700">ثبت و انتشار محصول</button>
            </form>
        </div>

        <!-- لیست محصولات ثبت شده -->
        <div class="bg-white p-6 rounded-2xl shadow-sm">
            <h3 class="font-bold text-xs text-gray-800 mb-4">محصولات ثبت‌شده در دیتابیس</h3>
            <div class="overflow-x-auto">
                <table class="w-full text-xs border-collapse">
                    <thead>
                        <tr class="bg-gray-50 border-b">
                            <th class="p-3 text-right">شناسه</th>
                            <th class="p-3 text-right">عنوان</th>
                            <th class="p-3 text-right">دسته‌بندی</th>
                            <th class="p-3 text-right">قیمت تخفیف‌خورده</th>
                            <th class="p-3 text-center">عملیات</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for p in products %}
                        <tr class="border-b">
                            <td class="p-3">{{ p.id }}</td>
                            <td class="p-3 font-bold">{{ p.title }}</td>
                            <td class="p-3">{{ p.category }}</td>
                            <td class="p-3 text-red-600 font-bold">{{\ "{:,}\".format(p.discount_price) }} تومان</td>
                            <td class="p-3 text-center">
                                <a href="/admin/delete/{{ p.id }}" onclick="return confirm('آیا از حذف این محصول مطمئن هستید؟')" class="bg-red-50 text-red-600 px-3 py-1 rounded font-bold">حذف</a>
                            </td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>
</html>

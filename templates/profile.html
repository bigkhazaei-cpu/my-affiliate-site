<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>حساب کاربری | دیجی‌پلاس</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 font-sans p-6">
    <div class="max-w-4xl mx-auto space-y-6">
        <div class="bg-white p-6 rounded-2xl shadow-sm flex justify-between items-center">
            <div>
                <h1 class="font-bold text-sm text-gray-800">حساب کاربری: <span class="text-red-600">{{ session.get('user_email') }}</span></h1>
            </div>
            <a href="/" class="bg-gray-100 px-4 py-2 rounded text-xs font-bold text-gray-700">← بازگشت به فروشگاه</a>
        </div>

        <div class="bg-white p-6 rounded-2xl shadow-sm">
            <h3 class="font-bold text-sm text-gray-800 mb-4">❤️ محصولات مورد علاقه شما</h3>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                {% for p in favorite_products %}
                <div class="border rounded-xl p-3 flex items-center gap-4">
                    <img src="{{ p.image_url }}" class="w-16 h-16 object-contain">
                    <div>
                        <h4 class="font-bold text-xs text-gray-800 line-clamp-1">{{ p.title }}</h4>
                        <span class="text-red-600 font-bold text-xs">{{\ "{:,}\".format(p.discount_price) }} تومان</span>
                        <a href="/product/{{ p.id }}" class="block text-blue-600 text-[10px] mt-1">مشاهده محصول →</a>
                    </div>
                </div>
                {% else %}
                <p class="text-xs text-gray-400">هنوز محصولی را به علاقه‌مندی‌ها اضافه نکرده‌اید.</p>
                {% endfor %}
            </div>
        </div>
    </div>
</body>
</html>

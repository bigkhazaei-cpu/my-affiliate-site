<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>{{ post.title }} | دیجی‌پلاس</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 font-sans p-6">
    <div class="max-w-3xl mx-auto bg-white p-8 rounded-2xl shadow-sm space-y-6">
        <a href="/blog" class="text-xs text-gray-400 font-bold">← بازگشت به مقالات</a>
        <h1 class="text-xl font-bold text-gray-800">{{ post.title }}</h1>
        <img src="{{ post.image_url }}" class="w-full h-64 object-cover rounded-xl">
        <div class="text-xs text-gray-600 leading-loose space-y-4">
            {{ post.content | safe }}
        </div>
    </div>
</body>
</html>

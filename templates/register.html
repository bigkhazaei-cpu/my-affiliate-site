<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>ثبت‌نام | دیجی‌پلاس</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 flex items-center justify-center h-screen">
    <div class="bg-white p-8 rounded-2xl shadow-sm border w-96 text-center">
        <h2 class="text-base font-bold text-red-600 mb-4">ثبت‌نام در دیجی‌پلاس</h2>
        {% if error %}<p class="text-red-500 text-xs mb-3">{{ error }}</p>{% endif %}
        <form method="POST" class="space-y-4 text-xs">
            <input type="email" name="email" placeholder="ایمیل..." required class="w-full border rounded p-2">
            <input type="password" name="password" placeholder="رمز عبور..." required class="w-full border rounded p-2">
            <button type="submit" class="w-full bg-red-600 text-white py-2.5 rounded font-bold">ثبت‌نام</button>
        </form>
        <p class="mt-4 text-xs text-gray-500">قبلاً ثبت‌نام کرده‌اید؟ <a href="/user-login" class="text-blue-600 font-bold">وارد شوید</a></p>
    </div>
</body>
</html>
